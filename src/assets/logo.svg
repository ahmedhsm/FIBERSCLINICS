<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E599" />
      <stop offset="100%" stop-color="#00A86B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Modern Geometric Clinic Icon -->
  <g transform="translate(10, 10)">
    <rect width="60" height="60" rx="16" fill="#131d31" stroke="#1f2d48" stroke-width="2"/>
    <!-- Dynamic athletic fiber waves / pulse -->
    <path d="M18 42L25 24L32 38L38 20L44 32" stroke="url(#emeraldGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="38" cy="20" r="3.5" fill="#00E599"/>
  </g>
  <!-- Text Brand -->
  <text x="82" y="46" font-family="'Outfit', 'Cairo', sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#FFFFFF">
    FI<tspan fill="#00E599">B</tspan>ERS
  </text>
  <text x="84" y="62" font-family="'Outfit', 'Cairo', sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.5" fill="#8E9EB5">
    PHYSICAL THERAPY &amp; REHAB
  </text>
</svg>
